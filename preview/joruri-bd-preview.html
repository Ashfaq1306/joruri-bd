<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joruri BD — app preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --green:#006A4E; --sos:#C8102E; --sos-press:#9E0B22; --amber:#FFB300; --ink:#14211C;
  --page:#DDE5E1; --bg:#F6F8F7; --surface:#FFFFFF; --surface-2:#EEF2F0; --text:#14211C; --text-2:#4A5A53;
  --line:#D2DBD7; --primary:#006A4E; --on-primary:#FFFFFF; --primary-weak:#CDEBDF; --panel:#006A4E;
  --ok:#2E7D32; --warn:#B26A00;
  --blood:#B71C1C; --ambulance:#00796B; --hospital:#1565C0; --police:#283593; --fire:#BF360C;
  --disaster:#006064; --firstaid:#2E7D32; --toolkit:#455A64; --blood-text:#B71C1C;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#050A08; --bg:#0E1714; --surface:#17241F; --surface-2:#1F2E28; --text:#E7EEEA; --text-2:#A9B8B1;
    --line:#2E3F38; --primary:#6FD3AE; --on-primary:#06261C; --primary-weak:#00513C; --panel:#00513C; --blood-text:#FF8A80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --page:#050A08; --bg:#0E1714; --surface:#17241F; --surface-2:#1F2E28; --text:#E7EEEA; --text-2:#A9B8B1;
  --line:#2E3F38; --primary:#6FD3AE; --on-primary:#06261C; --primary-weak:#00513C; --panel:#00513C; --blood-text:#FF8A80; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--page);color:var(--text);
  font-family:'Hind Siliguri','Noto Sans Bengali','Nirmala UI',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.45}
button{font:inherit;color:inherit}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.phone{position:relative;width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.caption{display:none}
@media (min-width:640px){
  .stage{padding:16px;gap:10px}
  .phone{width:400px;height:min(860px,calc(100% - 36px));border-radius:42px;border:10px solid #0B0F0D;box-shadow:0 24px 60px rgba(0,0,0,.28)}
  .caption{display:block;font-size:13px;color:var(--text-2)}
}
.preview-bar{background:var(--ink);color:#fff;font-size:12px;text-align:center;padding:5px 12px;flex:none}
:root[data-theme="dark"] .preview-bar{background:#000}
.app{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 28px;-webkit-overflow-scrolling:touch}
.scroll.pad-fab{padding-bottom:120px}
.appbar{display:flex;align-items:center;gap:4px;padding:6px 8px;min-height:60px;flex:none;background:var(--bg)}
.appbar h1{font-size:20px;margin:0;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:48px;height:48px;border:0;background:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--surface-2)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* Home */
.panel{background:var(--panel);border-radius:28px;padding:16px 20px 22px;color:#fff;text-align:center}
.panel-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel-top b{font-size:20px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.16);font-size:13px;font-weight:600}
.pill.on-light{background:var(--surface-2);color:var(--text)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sos{width:176px;height:176px;border-radius:50%;padding:6px;background:rgba(255,255,255,.2);margin:18px auto 14px;display:block;border:0;cursor:pointer}
.sos .disc{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;
  background:var(--sos);color:#fff;box-shadow:0 6px 18px rgba(200,16,46,.45);transition:transform .08s}
.sos:active .disc{background:var(--sos-press);transform:scale(.97)}
.sos .big{font-size:46px;font-weight:700;line-height:1;letter-spacing:2px}
.sos .hint{font-size:13px;margin-top:6px;padding:0 18px}
.easy .sos{width:224px;height:224px}.easy .sos .big{font-size:58px}.easy .sos .hint{font-size:16px}
.tagline{margin:0;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tile{display:flex;align-items:center;gap:12px;min-height:76px;padding:8px 12px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);font-size:16px;font-weight:600;text-align:left;cursor:pointer;line-height:1.25}
.tile:hover{border-color:var(--primary)}
.chip{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.accident{width:100%;margin-top:16px;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--amber);
  color:var(--ink);border:0;text-align:left;cursor:pointer}
.accident b{display:block;font-size:18px}.accident small{font-size:14px}
.bigbtn{display:flex;align-items:center;gap:16px;width:100%;min-height:88px;padding:16px 20px;border-radius:20px;border:0;color:#fff;
  font-size:21px;font-weight:700;text-align:left;cursor:pointer;margin-top:12px;line-height:1.25}

/* Generic */
.card{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);margin-top:12px}
.card h3{margin:0 0 4px;font-size:17px}
.muted{color:var(--text-2)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:14px;border:0;
  font-size:17px;font-weight:600;cursor:pointer;padding:8px 16px;text-align:center;text-decoration:none;line-height:1.25}
.btn + .btn{margin-top:8px}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-sos{background:var(--sos);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--primary)}
.btn-tonal{background:var(--primary-weak);color:var(--text)}
.btn-text{background:none;color:var(--primary);min-height:48px}
.btn[disabled]{opacity:.55;cursor:default}
.easy .btn{min-height:72px;font-size:20px}
h2.sec{font-size:20px;margin:26px 0 8px}
.label{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:12px;background:rgba(255,179,0,.18);
  border:1px solid var(--amber);font-size:13px;font-weight:600;margin-top:8px;line-height:1.35}
.sourcelink{display:inline-block;margin:6px 0 4px;color:var(--primary);font-weight:600;font-size:14px}
.num-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.num-head h3{font-size:17px;margin:0}
.num{font-size:30px;font-weight:700;line-height:1}

/* Nav */
.nav{display:flex;border-top:1px solid var(--line);background:var(--surface);height:72px;flex:none}
.easy .nav{height:84px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;
  color:var(--text-2);font-size:13px;cursor:pointer}
.nav .navpill{display:flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:16px}
.nav button[aria-current="page"]{color:var(--text);font-weight:600}
.nav button[aria-current="page"] .navpill{background:var(--primary-weak)}
.fab{position:absolute;right:16px;bottom:88px;width:92px;height:92px;border-radius:28px;background:var(--sos);color:#fff;border:0;
  font-size:24px;font-weight:700;letter-spacing:1px;box-shadow:0 8px 20px rgba(200,16,46,.4);cursor:pointer;z-index:5}

/* SOS screens */
.red{flex:1;background:var(--sos);color:#fff;display:flex;flex-direction:column;align-items:stretch;padding:24px;text-align:center}
.cd-label{font-size:24px;font-weight:600;margin:0}
.count{font-size:160px;font-weight:700;line-height:1.1}
.btn-white{background:#fff;color:var(--sos);min-height:88px;font-size:26px;font-weight:700}
.btn-ghost-white{background:none;color:#fff;min-height:48px;font-size:18px}
.sos-bar{background:var(--sos);color:#fff}
.sos-bar h1{font-weight:700}
.step{display:flex;gap:16px;padding:9px 0}
.step .ic{width:32px;display:grid;place-items:center;flex:none;height:30px}
.step b{display:block;font-size:17px}
.spinner{width:24px;height:24px;border:3px solid var(--line);border-top-color:var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}.sos .disc{transition:none}}
.coords{font-size:24px;font-weight:700;user-select:all;margin:2px 0}
.ok{color:var(--ok)} .warn{color:var(--warn)}

/* Lists, tabs, forms */
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.tabs button{flex:1;min-height:50px;border:0;background:none;font-weight:600;color:var(--text-2);border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--primary);border-color:var(--primary)}
.row{display:flex;align-items:center;gap:14px;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;
  text-align:left;cursor:pointer;min-height:66px}
.row .grow{flex:1;min-width:0}
.row .grow span{display:block}
.row small{color:var(--text-2)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:10px;margin-bottom:10px;font-size:17px}
.steps li::before{counter-increment:s;content:counter(s) ".";font-weight:700;min-width:22px}
:root[lang="bn"] .steps li::before{content:counter(s, bengali) "."}
.bottom-bar{padding:8px 16px 14px;border-top:1px solid var(--line);flex:none;background:var(--bg)}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.seg button{flex:1;min-height:48px;border:0;background:none;cursor:pointer;padding:0 6px;font-size:15px}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--primary-weak);font-weight:600}
.switch-row{display:flex;align-items:center;gap:12px;padding:12px 0;cursor:pointer;width:100%;border:0;background:none;text-align:left}
.switch-row .grow{flex:1}
.switch-row b{display:block;font-size:16px;font-weight:600}
.switch{width:52px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none}
.switch::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch-row[aria-checked="true"] .switch{background:var(--primary)}
.switch-row[aria-checked="true"] .switch::after{left:24px}
.choice{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:16px;border:1px solid var(--line);
  background:var(--surface-2);text-align:left;cursor:pointer;margin-top:8px}
.choice .grow{flex:1}
.choice b{display:block;font-size:17px;font-weight:600}
.choice[aria-pressed="true"]{border:2px solid var(--primary);background:var(--primary-weak)}
.field{display:block;margin-top:12px}
.field span{display:block;font-size:14px;margin-bottom:4px;color:var(--text-2)}
.field input{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);
  font:inherit;font-size:17px;padding:0 14px}
.err{color:var(--sos);font-size:14px;margin-top:4px}
.contact{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1px solid var(--line);margin-top:8px;background:var(--surface)}
.contact.first{border:2px solid var(--primary)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--primary-weak);display:grid;place-items:center;font-weight:700;flex:none}
.contact .grow{flex:1;min-width:0}
.contact .grow b{display:block}
.mini{border:0;background:none;color:var(--primary);font-weight:600;cursor:pointer;padding:8px;min-height:40px;font-size:14px}
.progress{height:4px;background:var(--surface-2);flex:none}
.progress i{display:block;height:100%;background:var(--primary)}
.welcome-mark{width:96px;height:96px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin:40px auto 20px}
.welcome-mark i{width:52px;height:52px;border-radius:50%;background:var(--sos);display:block}
.center{text-align:center}

/* Overlays */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(0,0,0,.5)}
.ov.middle{justify-content:center;padding:24px}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:20px 20px 24px;max-height:92%;overflow:auto}
.dialog{background:var(--surface);border-radius:24px;padding:22px;max-height:90%;overflow:auto}
.sheet h2,.dialog h2{margin:0 0 6px;font-size:20px}
.sim-tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:8px;background:var(--surface-2);color:var(--text-2);margin-bottom:8px}
.bubble{background:#1B7F3B;color:#fff;border-radius:18px 18px 4px 18px;padding:12px 14px;white-space:pre-wrap;font-size:15px;margin:12px 0;word-break:break-word}
.callscreen{position:absolute;inset:0;z-index:25;background:#0E1714;color:#fff;display:flex;flex-direction:column;align-items:center;padding:56px 24px 40px;text-align:center}
.callscreen .who{font-size:30px;font-weight:700;margin-top:24px}
.endcall{width:76px;height:76px;border-radius:50%;background:#E53935;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;margin-top:auto}
.endcall .ico,.callgo .ico{width:32px;height:32px}
.label .ico{width:16px;height:16px}
.dialnum{font-size:48px;font-weight:700;letter-spacing:4px;margin:24px 0}
.callgo{width:76px;height:76px;border-radius:50%;background:#2E7D32;border:0;color:#fff;cursor:pointer;display:grid;place-items:center;margin:0 auto}
.screenlight{position:absolute;inset:0;z-index:30;background:#fff;color:#333;display:grid;place-items:center;text-align:center;padding:24px;cursor:pointer;border:0;width:100%}
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#14211C;color:#fff;padding:12px 16px;border-radius:12px;z-index:40;font-size:15px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.needle{font-size:170px;color:var(--sos);transition:transform .15s linear;width:auto}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.groupbtn{min-height:84px;border-radius:16px;border:2px solid var(--blood);background:var(--surface);color:var(--blood-text);font-size:34px;font-weight:700;cursor:pointer}
.groupbtn:hover{background:var(--surface-2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px}
.gchip{flex:none;min-width:56px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;cursor:pointer}
.gchip[aria-pressed="true"]{background:var(--blood);border-color:var(--blood);color:#fff}
.field select{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:17px;padding:0 10px}
.gbadge{width:52px;height:52px;border-radius:50%;background:var(--blood);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.badges{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:14px;font-weight:600;align-items:center}
hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;background:#fff;padding:2px;object-fit:contain;flex:none}
.logo-card{display:block;width:240px;max-width:80%;margin:28px auto 16px;border-radius:28px;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.tile3{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:104px;padding:10px 6px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;text-align:center;cursor:pointer;line-height:1.2}
.tile3:hover{border-color:var(--primary)}
.tile3 .chip{width:44px;height:44px}
.price{font-size:24px;font-weight:700;color:var(--ok);white-space:nowrap}
:root[data-theme="dark"] .price{color:#7BD88F}
.prow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
.prow b{white-space:nowrap}
.btnrow{display:flex;gap:8px;margin-top:12px}.btnrow .btn{margin-top:0;min-height:48px;font-size:16px}
.qchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.qchip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.qchip[aria-pressed="true"]{background:var(--primary-weak);border-color:var(--primary)}
.row2{display:flex;gap:8px}.row2 .field{flex:1;min-width:0}
.badges .ok{color:var(--ok)}
.badges .tag-red{color:var(--sos)}
.badges .red{color:var(--sos)}
pre.msg{white-space:pre-wrap;font:inherit;font-size:15px;background:var(--surface-2);border-radius:12px;padding:12px;margin:10px 0}

/* =====================================================================
   Premium layer: glass bars, tinted shadows, mesh depth, type, motion.
   Everything above stays as the base; this only refines it.
   ===================================================================== */
:root{
  --font:'Hind Siliguri','Noto Sans Bengali','Nirmala UI',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --line:rgba(16,48,38,.10);
  --glass:rgba(250,252,251,.72); --glass-strong:rgba(255,255,255,.86); --glass-edge:rgba(16,48,38,.08); --glass-hi:rgba(255,255,255,.65);
  --shadow-1:0 1px 2px rgba(16,48,38,.05),0 8px 24px -10px rgba(16,48,38,.16);
  --shadow-2:0 2px 6px rgba(16,48,38,.06),0 20px 44px -16px rgba(16,48,38,.26);
  --sos-glow:0 8px 32px rgba(200,16,46,.40),0 2px 10px rgba(200,16,46,.28);
  --mesh:radial-gradient(120% 55% at 0% 0%,rgba(0,106,78,.11) 0%,transparent 60%),
         radial-gradient(80% 45% at 100% 6%,rgba(200,16,46,.06) 0%,transparent 62%),
         radial-gradient(120% 60% at 50% 112%,rgba(0,106,78,.09) 0%,transparent 62%);
  --page-mesh:radial-gradient(55% 50% at 12% 8%,rgba(0,106,78,.20),transparent 70%),
              radial-gradient(45% 45% at 88% 92%,rgba(200,16,46,.12),transparent 70%),
              linear-gradient(160deg,#EEF3F0,#E3EBE7);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --line:rgba(255,255,255,.08);
    --glass:rgba(18,30,25,.66); --glass-strong:rgba(22,35,30,.88); --glass-edge:rgba(0,0,0,.35); --glass-hi:rgba(255,255,255,.06);
    --shadow-1:0 1px 2px rgba(0,0,0,.30),0 10px 26px -12px rgba(0,0,0,.55);
    --shadow-2:0 2px 6px rgba(0,0,0,.35),0 22px 48px -16px rgba(0,0,0,.65);
    --mesh:radial-gradient(120% 55% at 0% 0%,rgba(0,140,100,.16) 0%,transparent 60%),
           radial-gradient(80% 45% at 100% 6%,rgba(200,16,46,.10) 0%,transparent 62%),
           radial-gradient(120% 60% at 50% 112%,rgba(0,106,78,.14) 0%,transparent 62%);
    --page-mesh:radial-gradient(55% 50% at 12% 8%,rgba(0,106,78,.25),transparent 70%),
                radial-gradient(45% 45% at 88% 92%,rgba(200,16,46,.14),transparent 70%),#040907;
  }
}
:root[data-theme="dark"]{
  --line:rgba(255,255,255,.08);
  --glass:rgba(18,30,25,.66); --glass-strong:rgba(22,35,30,.88); --glass-edge:rgba(0,0,0,.35); --glass-hi:rgba(255,255,255,.06);
  --shadow-1:0 1px 2px rgba(0,0,0,.30),0 10px 26px -12px rgba(0,0,0,.55);
  --shadow-2:0 2px 6px rgba(0,0,0,.35),0 22px 48px -16px rgba(0,0,0,.65);
  --mesh:radial-gradient(120% 55% at 0% 0%,rgba(0,140,100,.16) 0%,transparent 60%),
         radial-gradient(80% 45% at 100% 6%,rgba(200,16,46,.10) 0%,transparent 62%),
         radial-gradient(120% 60% at 50% 112%,rgba(0,106,78,.14) 0%,transparent 62%);
  --page-mesh:radial-gradient(55% 50% at 12% 8%,rgba(0,106,78,.25),transparent 70%),
              radial-gradient(45% 45% at 88% 92%,rgba(200,16,46,.14),transparent 70%),#040907;
}

/* Honest-state notices */
.sim-notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin:0 0 8px;border-radius:14px;font-size:14.5px;line-height:1.5;
  background:rgba(255,179,0,.14);border:1px solid rgba(255,179,0,.55)}
.sim-notice .ico{width:18px;height:18px;margin-top:2px;color:#B26A00}
.inforow{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin-top:8px;border-radius:14px;background:var(--surface-2);font-size:15px;line-height:1.5}
.inforow .ico{width:20px;height:20px;margin-top:2px;color:var(--text-2)}
.preview-bar.real{background:linear-gradient(90deg,#9c0a22,#c8102e)}
.copybox{width:100%;min-height:120px;border-radius:12px;border:1px solid var(--line);padding:10px;font:inherit;font-size:15px;background:var(--surface);color:var(--text)}

/* Background & depth */
body{background:var(--page-mesh);background-attachment:fixed;font-family:var(--font);line-height:1.55;
  font-weight:400;letter-spacing:.003em;text-rendering:optimizeLegibility}
.phone{background-color:var(--bg);background-image:var(--mesh)}
@media (min-width:640px){
  .phone{border:10px solid #0c1210;box-shadow:0 50px 90px -30px rgba(4,40,28,.45),0 0 0 1px rgba(255,255,255,.05) inset}
}
.preview-bar{background:linear-gradient(90deg,#0c1712,#16241e);font-size:11.5px;letter-spacing:.02em;font-weight:500;opacity:.96}

/* Typography */
h1,h2,h3{line-height:1.25;letter-spacing:-.012em}
h3{font-weight:700}
h2.sec{font-size:18px;font-weight:700;margin:28px 0 10px}
.appbar h1{font-size:19px;font-weight:700;letter-spacing:-.015em}
.muted{color:var(--text-2)}
.field span,.label-row{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--text-2)}
.label-row{margin:18px 0 8px}
.req{font-style:normal;font-weight:500;font-size:11px;color:var(--sos);background:rgba(200,16,46,.08);padding:1px 6px;border-radius:6px;margin-left:4px;letter-spacing:.02em}
.ob-title{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:18px 0 6px}
.ob-lead{font-size:16px;line-height:1.6;color:var(--text-2);margin:0 0 6px}
.tagline{font-weight:500;letter-spacing:.01em;opacity:.95}
.num{letter-spacing:-.02em}

/* Icons (Lucide inline SVG) */
.ico{display:inline-flex;width:1.25em;height:1.25em;flex:none;align-items:center;justify-content:center;vertical-align:-.22em}
.ico svg{width:100%;height:100%}
.chip .ico{width:22px;height:22px}
.bigbtn .ico{width:30px;height:30px}
.accident .ico{width:26px;height:26px}
.navpill .ico{width:22px;height:22px}
.iconbtn .ico{width:22px;height:22px}
.badges .ico{width:15px;height:15px;vertical-align:-.2em}
.needle{display:inline-block;transition:transform .15s linear}
.needle .ico{width:170px;height:170px;color:var(--sos)}
.hero-ico{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:24px;background:var(--surface);box-shadow:var(--shadow-1);margin-top:12px}
.hero-ico .ico{width:44px;height:44px}

/* Glass: top bar, tabs, bottom nav, bottom bars, overlays */
.app{position:relative}
.appbar{position:absolute;top:0;left:0;right:0;z-index:6;min-height:60px;padding:6px 10px;gap:8px;
  background:var(--glass);-webkit-backdrop-filter:blur(15px) saturate(170%);backdrop-filter:blur(15px) saturate(170%);
  border-bottom:1px solid var(--glass-edge);box-shadow:inset 0 -1px 0 var(--glass-hi)}
.appbar + .scroll{padding-top:74px}
.appbar + .tabs{position:absolute;top:60px;left:0;right:0;z-index:5;background:var(--glass);
  -webkit-backdrop-filter:blur(15px) saturate(170%);backdrop-filter:blur(15px) saturate(170%);border-bottom:1px solid var(--glass-edge)}
.appbar + .tabs + .scroll{padding-top:124px}
.sos-bar{background:linear-gradient(135deg,#d8193a,#a50c25);border-bottom:0;box-shadow:0 8px 24px -10px rgba(200,16,46,.6)}
.nav{position:absolute;left:0;right:0;bottom:0;z-index:6;height:74px;background:var(--glass);
  -webkit-backdrop-filter:blur(15px) saturate(170%);backdrop-filter:blur(15px) saturate(170%);
  border-top:1px solid var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi)}
.easy .nav{height:86px}
.app:has(> .nav) .scroll{padding-bottom:108px}
.easy .app:has(> .nav) .scroll{padding-bottom:120px}
.nav button{font-weight:500;letter-spacing:.01em}
.navpill{transition:background-color .25s var(--ease),transform .2s var(--ease)}
.nav button[aria-current="page"] .navpill{background:var(--primary-weak);box-shadow:0 4px 12px -6px rgba(0,106,78,.5)}
.fab{bottom:94px;border-radius:24px;background:linear-gradient(145deg,#e0213f,#b70e29);box-shadow:var(--sos-glow);letter-spacing:.04em}
.tabs button{transition:color .2s,border-color .25s var(--ease)}
.tabs button[aria-selected="true"]{border-bottom-width:3px}
.bottom-bar{background:var(--glass);-webkit-backdrop-filter:blur(15px) saturate(170%);backdrop-filter:blur(15px) saturate(170%);
  border-top:1px solid var(--glass-edge)}
.progress{background:transparent}.progress i{background:linear-gradient(90deg,#00a374,#006A4E);border-radius:0 4px 4px 0}
.ov{background:rgba(6,18,14,.36);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.sheet,.dialog{background:var(--glass-strong);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--glass-hi);box-shadow:0 -12px 48px rgba(0,0,0,.18)}
.dialog{box-shadow:var(--shadow-2)}
.toast{background:rgba(16,28,23,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;box-shadow:var(--shadow-2)}

/* Brand lockup */
.panel-top .brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo-tile{width:42px;height:42px;border-radius:13px;background:#fff;display:grid;place-items:center;flex:none;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.04)}
.logo-tile img{width:32px;height:32px;object-fit:contain;border-radius:8px}
.logo-tile.sm{width:34px;height:34px;border-radius:11px;margin-left:4px;box-shadow:var(--shadow-1)}
.logo-tile.sm img{width:26px;height:26px}
.brand-text{display:flex;flex-direction:column;min-width:0;text-align:left}
.brand-text b{font-size:19px;font-weight:700;letter-spacing:-.015em;line-height:1.15}
.brand-text small{font-size:11.5px;font-weight:500;letter-spacing:.04em;opacity:.82}
.logo-card{box-shadow:var(--shadow-2);border-radius:30px}

/* Home panel and SOS */
.panel{position:relative;overflow:hidden;border-radius:30px;
  background:radial-gradient(120% 90% at 0% 0%,#0c8d68 0%,#006A4E 48%,#004a36 100%);
  box-shadow:0 22px 44px -20px rgba(0,80,58,.65)}
.panel::before{content:'';position:absolute;inset:auto -30% -55% auto;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10),transparent 65%);pointer-events:none}
:root[data-theme="dark"] .panel{background:radial-gradient(120% 90% at 0% 0%,#0a6f52 0%,#00513C 50%,#00301f 100%)}
.panel > *{position:relative}
.sos{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),0 0 0 10px rgba(255,255,255,.05)}
.sos .disc{background:radial-gradient(circle at 35% 28%,#ef3d58 0%,#c8102e 55%,#a00b23 100%);
  box-shadow:var(--sos-glow),inset 0 2px 0 rgba(255,255,255,.28),inset 0 -8px 18px rgba(0,0,0,.20);
  transition:transform .18s var(--ease),box-shadow .25s var(--ease)}
.sos:hover .disc{box-shadow:0 12px 40px rgba(200,16,46,.50),0 2px 10px rgba(200,16,46,.30),inset 0 2px 0 rgba(255,255,255,.28)}
.sos:active .disc{transform:scale(.95);background:radial-gradient(circle at 35% 28%,#d92e48 0%,#a50c25 70%)}
.sos .big{letter-spacing:.06em;text-shadow:0 2px 8px rgba(0,0,0,.18)}
.pill{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18)}
.pill .dot{box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.red{background:radial-gradient(circle at 50% 30%,#e3223f 0%,#c8102e 45%,#9c0a22 100%)}

/* Surfaces */
.card{border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-1)}
.card.soft{background:var(--surface-2);box-shadow:none}
.tile,.tile3{border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-1)}
.chip{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 8px 16px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25)}
.chip::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 60%);pointer-events:none}
.accident{background:linear-gradient(135deg,#FFC93D,#FFB300);box-shadow:0 14px 28px -14px rgba(230,150,0,.85);border-radius:20px}
.bigbtn{border-radius:22px;box-shadow:0 14px 28px -16px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.choice{border-radius:18px;background:var(--surface);box-shadow:var(--shadow-1)}
.choice[aria-pressed="true"]{box-shadow:0 0 0 4px rgba(0,106,78,.12),var(--shadow-1)}
.contact{border-radius:18px;box-shadow:var(--shadow-1)}
.gbadge{background:radial-gradient(circle at 35% 30%,#d33a3a,#b71c1c 60%,#8d1414);box-shadow:0 8px 18px -8px rgba(183,28,28,.7)}
.groupbtn{border-radius:20px;box-shadow:var(--shadow-1)}
.groupgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.groupgrid .gchip{min-width:0;min-height:52px;font-size:18px}
.gchip,.qchip{box-shadow:var(--shadow-1)}
.gchip[aria-pressed="true"]{box-shadow:0 8px 18px -8px rgba(183,28,28,.7)}
.you{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--primary);padding:1px 8px;border-radius:8px;vertical-align:2px}
:root[data-theme="dark"] .you{color:#06261C}
.profile-card{background:linear-gradient(160deg,var(--surface),var(--surface-2))}
.label{border-radius:10px}

/* Buttons */
.btn{border-radius:15px;font-weight:600;letter-spacing:.005em}
.btn-primary{background:linear-gradient(180deg,#0a7d5c,#006A4E);box-shadow:0 10px 22px -12px rgba(0,106,78,.85),inset 0 1px 0 rgba(255,255,255,.18)}
:root[data-theme="dark"] .btn-primary{background:linear-gradient(180deg,#86e0bf,#5cc79f)}
.btn-sos{background:linear-gradient(180deg,#e01f3c,#b70e29);box-shadow:0 12px 26px -12px rgba(200,16,46,.75),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-outline{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-1)}
.btn-tonal{box-shadow:inset 0 0 0 1px rgba(0,106,78,.10)}
.btn-white{box-shadow:0 14px 30px -12px rgba(0,0,0,.4)}

/* Inputs */
.field input,.field select{border-radius:14px;border:1px solid var(--line);background:var(--surface);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.03);transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(0,106,78,.14)}
.switch{transition:background-color .25s var(--ease)}
.switch::after{box-shadow:0 2px 6px rgba(0,0,0,.25);transition:left .25s var(--ease)}

/* Micro-interactions: smooth hover, gentle press */
button,.btn,.tile,.tile3,.row,.choice,.qchip,.gchip,.groupbtn,.bigbtn,.accident,.mini,.iconbtn,.contact,a.btn{
  transition:transform .16s var(--ease),box-shadow .22s var(--ease),background-color .2s,border-color .2s,filter .2s,color .2s}
button:active,.btn:active,.tile:active,.tile3:active,.choice:active,.qchip:active,.gchip:active,.groupbtn:active,
.bigbtn:active,.accident:active,.mini:active,.iconbtn:active,a.btn:active{transform:scale(.96)}
.row:active{transform:scale(.99)}
@media (hover:hover){
  .tile:hover,.tile3:hover,.groupbtn:hover,.choice:hover,.qchip:hover,.gchip:hover{transform:translateY(-2px);box-shadow:var(--shadow-2)}
  .btn:hover,a.btn:hover,.bigbtn:hover,.accident:hover{filter:brightness(1.04);transform:translateY(-1px)}
  .row:hover{background:rgba(0,106,78,.04)}
  .iconbtn:hover{background:rgba(0,106,78,.08)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation-duration:.001s!important}
}
</style>

/* Same rules as packages/core BdPhone */
function clean(s){ let o=''; for (const ch of s){ const u = ch.charCodeAt(0);
  if (u>=48 && u<=57) o+=ch; else if (u>=0x09E6 && u<=0x09EF) o+=String.fromCharCode(48+u-0x09E6); else if (u===43 && o==='') o+=ch; } return o; }
function normMobile(s){ let d = clean(s); if (d.startsWith('+880')) d = '0'+d.slice(4); else if (d.startsWith('880')) d = '0'+d.slice(3);
  return /^01[3-9]\d{8}$/.test(d) ? '+88'+d : null; }
function normContact(s){ const m = normMobile(s); if (m) return m; const d = clean(s); const c = d.replace('+','').length; return (c<6 || c>15) ? null : d; }
function showPhone(n){ if (n.startsWith('+880') && n.length===14){ const l='0'+n.slice(4); return l.slice(0,5)+'-'+l.slice(5); } return n; }

/* Same text as packages/core SosMessageBuilder */
const two = n => String(n).padStart(2,'0');
const fmt = d => `${two(d.getDate())}/${two(d.getMonth()+1)}/${d.getFullYear()} ${two(d.getHours())}:${two(d.getMinutes())}`;
const mapLink = l => `https://maps.google.com/?q=${l.lat.toFixed(5)},${l.lng.toFixed(5)}`;
const coordText = l => `${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}`;
function buildMessage(language, now, loc, extra){
  const en = language === 'en';
  const lines = [en ? 'EMERGENCY - I may be in danger and need help.' : 'জরুরি - আমি বিপদে থাকতে পারি, সাহায্য দরকার।'];
  const x = (extra || '').trim(); if (x) lines.push(x.slice(0,100));
  if (loc){
    lines.push(`${en ? 'Location' : 'অবস্থান'}: ${mapLink(loc)}`);
    if (loc.acc > 0) lines.push(en ? `Accuracy: about ${Math.round(loc.acc)} m` : `নির্ভুলতা: প্রায় ${Math.round(loc.acc)} মিটার`);
    if (now - loc.time > 120000) lines.push(en ? `Location from: ${fmt(loc.time)}` : `অবস্থানের সময়: ${fmt(loc.time)}`);
  } else lines.push(en ? 'Location: not available (GPS off or no signal)' : 'অবস্থান: পাওয়া যায়নি (জিপিএস বন্ধ বা সিগন্যাল নেই)');
  lines.push(`${en ? 'Time' : 'সময়'}: ${fmt(now)}`);
  lines.push(en ? '- sent by Joruri BD' : '- জরুরি বিডি থেকে পাঠানো');
  return lines.join('\n');
}
function getLocation(timeout=10000){
  return new Promise(resolve => {
    if (!('geolocation' in navigator)) return resolve({loc:null, issue:'unavailable'});
    if (!window.isSecureContext) return resolve({loc:null, issue:'insecure'});  // file:// or plain http
    try {
      navigator.geolocation.getCurrentPosition(
        p => resolve({loc:{lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, time:new Date(p.timestamp)}, issue:'none'}),
        e => resolve({loc:null, issue: e.code === 1 ? 'denied' : e.code === 3 ? 'timeout' : 'unavailable'}),
        {enableHighAccuracy:true, timeout, maximumAge:120000});
    } catch(e){ resolve({loc:null, issue:'unavailable'}); }
  });
}

  document.getElementById('previewBar').textContent = t(st.realPhone ? 'realBanner' : 'previewBanner');
  document.getElementById('previewBar').classList.toggle('real', !!st.realPhone);
  document.getElementById('caption').textContent = t('caption');
  document.getElementById('phone').classList.toggle('easy', !!st.easy);

  const sc2 = app.querySelector('.scroll'); if (sc2 && key === lastKey) sc2.scrollTop = lastScroll;

let compassHandler = null, compassSeen = false;
SCREENS.compass = () => `${appbar(t('compass'))}<div class="scroll center">
  <div style="margin-top:24px"><span class="needle" id="needle">${ic('navigation')}</span></div>
  <p id="heading" style="font-size:26px;font-weight:700;margin:16px 0">${esc(t('compassWaiting'))}</p>
  <button class="btn btn-primary" data-a="compassStart">${esc(t('compassStart'))}</button>
  <p class="muted" style="margin-top:20px">${esc(t('compassHint'))}</p></div>`;
function stopCompass(){
  if (compassHandler){ window.removeEventListener('deviceorientationabsolute', compassHandler); window.removeEventListener('deviceorientation', compassHandler); compassHandler = null; }
}
async function startCompass(){
  const say = k => { const h = document.getElementById('heading'); if (h) h.textContent = t(k); };
  if (!window.isSecureContext){ say('compassInsecure'); return; }
  if (typeof DeviceOrientationEvent === 'undefined'){ say('compassUnavailable'); return; }
  if (DeviceOrientationEvent.requestPermission) {
    try { if (await DeviceOrientationEvent.requestPermission() !== 'granted'){ say('compassDenied'); return; } }
    catch(e){ say('compassDenied'); return; }
  }
  say('compassWaiting');
  stopCompass(); compassSeen = false;
  compassHandler = e => {
    const h = e.webkitCompassHeading ?? (e.absolute && e.alpha != null ? 360 - e.alpha : null);
    if (h == null) return;
    compassSeen = true;
    const n = ((h % 360) + 360) % 360, i = Math.floor((n + 22.5) / 45) % 8;
    const needle = document.getElementById('needle'), head = document.getElementById('heading');
    if (needle) needle.style.transform = `rotate(${-n}deg)`;
    if (head) head.textContent = `${digits(Math.round(n))}°  ${S[lang()].directions[i]}`;
  };
  window.addEventListener('deviceorientationabsolute', compassHandler);
  window.addEventListener('deviceorientation', compassHandler);
  setTimeout(() => { if (!compassSeen && cur().n === 'compass'){ const h = document.getElementById('heading'); if (h) h.textContent = t('compassUnavailable'); } }, 2500);
}

/* ---------- Blood: pick the group, then call donors ---------- */
let bq = {needed:'A+', includeCompatible:false, areaText:'', availableOnly:true};
const districtById = id => LOC.districts.find(d => d.id === id);
/* Same rules and order as packages/core searchDonors */
function findDonors(){
  const groups = bq.includeCompatible ? COMPAT[bq.needed] : [bq.needed];
  const area = bq.areaText.trim().toLowerCase();
  const me = myDonor();
  const list = (me ? [...DONORS, me] : DONORS).filter(d => d.shareConsent && groups.includes(d.bloodGroup) && (!bq.availableOnly || d.available)
    && (!st.bloodDistrict || d.districtId === st.bloodDistrict)
    && (st.bloodDistrict || !st.bloodDivision || (districtById(d.districtId) || {}).divisionId === st.bloodDivision)
    && (!area || (d.area || '').toLowerCase().includes(area)));
  const r = v => v ? 0 : 1;
  return list.sort((a, b) => r(a.bloodGroup === bq.needed) - r(b.bloodGroup === bq.needed) || r(a.available) - r(b.available)
    || r(a.verified) - r(b.verified) || (a.lastDonation || '1900').localeCompare(b.lastDonation || '1900') || a.name.localeCompare(b.name));
}

  <p class="muted" style="font-size:14px;margin-top:20px">${esc(t('bloodDisclaimer'))}</p></div>`;
function donorResults(){
  const list = findDonors(), L = lang();
  if (!list.length) return `<div class="card"><h3>${esc(t('noDonorsTitle'))}</h3><p>${esc(t('noDonorsBody'))}</p>

function placeOk(districtId, area){
  if (st.dirDistrict && districtId !== st.dirDistrict) return false;
  if (!st.dirDistrict && st.dirDivision && (districtById(districtId) || {}).divisionId !== st.dirDivision) return false;
  const a = placeArea.trim().toLowerCase(); return !a || (area || '').toLowerCase().includes(a);
}
const placeText = (area, districtId) => { const d = districtById(districtId); return (area ? area + ', ' : '') + (d ? d[lang()] : districtId); };
const taka = n => lang() === 'bn' ? '৳' + digits(n) : 'Tk ' + n;
const testMatch = (tt, q) => { q = q.trim().toLowerCase(); return !!q && (tt.name.toLowerCase().includes(q) || (tt.aliases || []).some(a => a.toLowerCase().includes(q))); };
/* packages/core findTest: cheapest first, unpriced last */
function findOffers(q){
  const out = [];
  for (const h of HOSPITALS) if (placeOk(h.districtId, h.area)) for (const tt of h.tests || []) if (testMatch(tt, q)) out.push({h, t:tt});
  return out.sort((a, b) => (a.t.priceBdt == null) - (b.t.priceBdt == null) || (a.t.priceBdt || 0) - (b.t.priceBdt || 0) || a.h.name.localeCompare(b.h.name));

      <div style="height:16px"></div><button class="btn btn-primary" data-a="saveContact">${esc(t('save'))}</button>
      <button class="btn btn-text" data-a="closeOverlay">${esc(t('cancel'))}</button></div></div>`;
    setTimeout(() => {
      if (el.contains(document.activeElement)) return;  // never steal focus from a field the person is already typing in
      const n = document.getElementById(o.phoneErr && !o.nameErr ? 'cPhone' : 'cName'); if (n) n.focus();

function openOverlay(o){ overlay = o; renderOverlay(); }

/* ---------- SOS flow (same order as the app) ---------- */
function refreshStatus(){ if (st.onboardingDone && cur().n === 'status') render(); }
async function startRun(){
  const me = run = {running:true, loc:null, locOut:'pending', msgOut:'pending', callOut:'pending', target:'', message:''};
  refreshStatus();
  let loc = null;
  if (st.includeLocation) {
    const r = await getLocation(10000);
    if (run !== me) return;
    loc = r.loc; me.loc = loc; me.locOut = loc ? 'found' : ({denied:'denied', insecure:'insecure', timeout:'timeout'}[r.issue] || 'notFound');
  } else me.locOut = 'disabled';
  me.message = buildMessage(st.smsLang, new Date(), loc, st.extraLine);
  refreshStatus();
  const contacts = st.contacts;
  if (!contacts.length) {
    me.msgOut = 'noContacts'; me.target = '999'; me.callOut = 'started'; me.running = false;
    refreshStatus(); A.dial('999');
    return;
  }
  me.target = contacts[0].name; me.msgOut = 'opened'; me.callOut = 'waiting';
  refreshStatus();
  // The SMS app opens; the app waits until you come back, then calls.
  if (st.realPhone) {
    openExternal(smsUri(contacts.map(c => c.phone), me.message));
    const cameBack = await waitForReturn(180000);
    if (run !== me) return;
    if (!cameBack){ me.callOut = 'notReturned'; me.running = false; refreshStatus(); return; }
    await sleep(600);
    if (run !== me) return;
    me.callOut = 'started'; me.running = false; refreshStatus();
    openExternal('tel:' + contacts[0].phone);
    return;
  }
  await new Promise(resolve => openOverlay({type:'sms', contacts, body:me.message, onClose:resolve}));
  if (run !== me) return;
  await sleep(600);
  if (run !== me) return;
  me.callOut = 'started'; me.running = false;
  refreshStatus();
  openOverlay({type:'call', name:contacts[0].name, number:showPhone(contacts[0].phone)});
}
/* Real phone apps (opt-in). Same URI rules as the Flutter SmsService. */
function smsUri(numbers, body){
  const b = encodeURIComponent(body);
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    return numbers.length === 1 ? `sms:${numbers[0]}&body=${b}` : `sms:/open?addresses=${numbers.map(encodeURIComponent).join(',')}&body=${b}`;
  }
  return `sms:${numbers.join(/SamsungBrowser|SM-[A-Z0-9]/i.test(navigator.userAgent) ? ',' : ';')}?body=${b}`;
}
function openExternal(uri){
  try { const a = document.createElement('a'); a.href = uri; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); } catch(e){}
  setTimeout(() => { if (!document.hidden) toast(t('openBlocked')); }, 2200);
}
let releaseReturn = null;
function waitForReturn(ms){
  return new Promise(resolve => {
    let left = false;
    const onVis = () => { if (document.hidden) left = true; else if (left) done(true); };
    const done = v => { document.removeEventListener('visibilitychange', onVis); clearTimeout(timer); releaseReturn = null; resolve(v); };
    const timer = setTimeout(() => done(false), ms);
    releaseReturn = done;
    document.addEventListener('visibilitychange', onVis);
  });
}
function launchSos(){ if (countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; } replaceTop('status'); startRun(); }

/* ---------- actions ---------- */
const A = {
  back, noop(){},
  pfGroup(g){ pfCapture(); pf.group = g; delete pfErr.group; render(); },
  pfDonor(){ pfCapture(); pf.donor = !pf.donor; delete pfErr.consent; render(); },
  pfAvail(){ pfCapture(); pf.available = !pf.available; render(); },
  pfConsent(){ pfCapture(); pf.consent = !pf.consent; delete pfErr.consent; render(); },
  saveProfileOb(){
    if (!pfValid()){ render(); const e = document.querySelector('.err'); if (e) e.scrollIntoView({block:'center'}); return; }
    pfSave(); pf = null; ob = 2; render();
  },
  saveProfileScreen(){
    if (!pfValid()){ render(); const e = document.querySelector('.err'); if (e) e.scrollIntoView({block:'center'}); return; }
    pfSave(); pf = null; toast(t('profileSaved')); back();
  },
  toggleMyAvail(){ st.profile.available = !st.profile.available; save(); render(); },
  hosTab(v){ hosTab = Number(v); render(); },
  quickTest(v){ testQuery = v; render(); },
  toggle24(){ only24 = !only24; render(); },
  pickGroup(g){ bq.needed = g; go('donors'); },
  pickGroupInList(g){ bq.needed = g; render(); },
  toggleCompat(){ bq.includeCompatible = !bq.includeCompatible; render(); },
  toggleAvailable(){ bq.availableOnly = !bq.availableOnly; render(); },
  sos(){
    if (st.sosMode === 'instant'){ go('status'); startRun(); return; }
    countdownLeft = st.countdown; go('countdown');
    if (navigator.vibrate) navigator.vibrate(80);
    countdownTimer = setInterval(() => {
      if (countdownLeft <= 1){ launchSos(); return; }
      countdownLeft--; if (navigator.vibrate) navigator.vibrate(80); render();
    }, 1000);
  },
  cancelSos(){ back(); },
  sendNow(){ launchSos(); },
  safe(){ run = null; overlay = null; tab('home'); },
  dial(n){ if (st.realPhone) openExternal('tel:' + n); else openOverlay({type:'dial', number:n}); },
  callNow(){ if (releaseReturn) releaseReturn(true); },
  dialCall(){ const n = overlay.number; overlay = null; openOverlay({type:'call', name:n, number:''}); },
  callPrimary(){ const c = st.contacts[0]; if (!c){ go('contacts'); return; } if (st.realPhone){ openExternal('tel:' + c.phone); return; } openOverlay({type:'call', name:c.name, number:showPhone(c.phone)}); },
  closeOverlay, smsClose: closeOverlay,
  smsSend(){ toast(t('simSent')); closeOverlay(); },
  async resend(){
    if (!run || !st.contacts.length) return;
    if (st.includeLocation){ const r = await getLocation(10000); if (r.loc){ run.loc = r.loc; run.locOut = 'found'; } }
    run.message = buildMessage(st.smsLang, new Date(), run.loc, st.extraLine); refreshStatus();
    if (st.realPhone) openExternal(smsUri(st.contacts.map(c => c.phone), run.message)); else openOverlay({type:'sms', contacts:st.contacts, body:run.message});
  },
  shareMessage(){ shareText(run ? run.message : ''); },
  copyCoords(){ if (run && run.loc) copyText(`${coordText(run.loc)}\n${mapLink(run.loc)}`); },
  screenLight(){ openOverlay({type:'light'}); },
  siren(){
    if (sirenAudio){ try { sirenAudio.osc.stop(); sirenAudio.ctx.close(); } catch(e){} sirenAudio = null; render(); return; }
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'triangle'; gain.gain.value = 0.3; osc.connect(gain); gain.connect(ctx.destination);
      const now = ctx.currentTime;
      for (let i = 0; i < 300; i++){ osc.frequency.setValueAtTime(650, now + i * 2); osc.frequency.linearRampToValueAtTime(1400, now + i * 2 + 1); osc.frequency.linearRampToValueAtTime(650, now + i * 2 + 2); }
      osc.start(); sirenAudio = {ctx, osc};
    } catch(e){ toast(t('notSupported')); }
    render();
  },
  compassStart(){ startCompass(); },
  async refreshLocation(){
    locState = {loading:true, loc:null, issue:null}; render();
    const r = await getLocation(10000); locState = {loading:false, loc:r.loc, issue:r.loc ? null : r.issue};
    if (cur().n === 'location') render();
  },
  shareLocation(){ if (locState.loc) shareText(fn('myLocationMessage', mapLink(locState.loc))); },
  copyLocation(){ if (locState.loc) copyText(`${coordText(locState.loc)}\n${mapLink(locState.loc)}`); },
  textLocation(){
    if (!locState.loc) return;
    const body = fn('myLocationMessage', mapLink(locState.loc));
    if (st.realPhone) openExternal(smsUri(st.contacts.map(c => c.phone), body)); else openOverlay({type:'sms', contacts:st.contacts, body});
  },
  toggleReal(){
    if (st.realPhone){ set({realPhone:false}); return; }
    openOverlay({type:'confirm', title:t('realModeConfirmTitle'), body:t('realModeConfirmBody'), yesLabel:t('turnOn'), yes(){ set({realPhone:true}); }});
  },
  async askLocation(){ await getLocation(10000); checkPermission(); },
  setLang(v){ set({lang:v}); },
  setTheme(v){ set({theme:v}); },
  setSosMode(v){ set({sosMode:v}); },
  setCountdown(v){ set({countdown:Number(v)}); },
  setSmsLang(v){ set({smsLang:v}); },
  toggleEasy(){ set({easy:!st.easy}); },
  toggleLocation(){ set({includeLocation:!st.includeLocation}); },
  preview(){
    const input = document.getElementById('extraLine'); if (input){ st.extraLine = input.value.trim(); save(); }
    const loc = st.includeLocation ? {lat:23.8103, lng:90.4125, acc:15, time:new Date()} : null;
    openOverlay({type:'preview', text:buildMessage(st.smsLang, new Date(), loc, st.extraLine)});
  },
  deleteData(){ openOverlay({type:'confirm', title:t('deleteLocalData'), body:t('deleteLocalDataBody'), yes(){
    st = {...DEFAULTS}; save(); try { localStorage.removeItem(KEY); } catch(e){} run = null; ob = 0; stack = [{n:'home'}]; applyTheme(); render(); toast(t('deleted')); }}); },
  confirmYes(){ const o = overlay; overlay = null; renderOverlay(); if (o && o.yes) o.yes(); },
  addContact(){ openOverlay({type:'contact'}); },
  editContact(id){ const c = st.contacts.find(x => x.id === id); if (c) openOverlay({type:'contact', id, name:c.name, phone:showPhone(c.phone).replace('-', '')}); },
  removeContact(id){ const c = st.contacts.find(x => x.id === id); if (!c) return;
    openOverlay({type:'confirm', title:t('removeContactQuestion'), body:c.name, yes(){ set({contacts:st.contacts.filter(x => x.id !== id)}); }}); },
  makePrimary(id){ const c = st.contacts.find(x => x.id === id); if (c) set({contacts:[c, ...st.contacts.filter(x => x.id !== id)]}); },
  saveContact(){
    const name = document.getElementById('cName').value.trim(), raw = document.getElementById('cPhone').value;
    const phone = normContact(raw);
    if (!name || !phone){ overlay = {...overlay, name, phone:raw, nameErr:!name, phoneErr:!phone}; renderOverlay(); return; }
    const o = overlay; overlay = null;
    const list = [...st.contacts];
    if (o.id){ const i = list.findIndex(x => x.id === o.id); if (i >= 0) list[i] = {...list[i], name, phone}; }
    else if (list.length < 3) list.push({id:String(Date.now()), name, phone});
    set({contacts:list});
  },
  obLang(v){ set({lang:v}); ob = 1; render(); },
  obNext(){ ob = Math.min(3, ob + 1); render(); },
  obBack(){ ob = Math.max(0, ob - 1); render(); },
  obFinish(){ stack = [{n:'home'}]; set({onboardingDone:true}); },
};
function copyText(text, okKey = 'copied'){
  const ok = () => toast(t(okKey));
  const legacy = () => {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '0'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
      const copied = document.execCommand('copy');
      ta.remove();
      if (copied){ ok(); return; }
    } catch(e){}
    openOverlay({type:'copyManual', text});  // last resort: show it ready to copy by hand
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(ok, legacy); else legacy();
}
function shareText(text){
  if (!navigator.share){ copyText(text); return; }
  navigator.share({text}).catch(e => {
    if (e && e.name === 'AbortError') toast(t('shareCancelled'));
    else copyText(text, 'shareFailedCopied');
  });
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a],[data-go],[data-tab]');
  if (!el) return;
  if (el.dataset.a === 'noop'){ e.stopPropagation(); return; }
  if (el.dataset.go){ go(el.dataset.go, el.dataset.p); return; }
  if (el.dataset.tab){ tab(el.dataset.tab, el.dataset.p); return; }
  const f = A[el.dataset.a];
  if (f){ e.preventDefault(); f(el.dataset.p, el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay) closeOverlay();
  if (e.key === 'Enter' && overlay && overlay.type === 'contact') A.saveContact();
});
window.addEventListener('online', render);
window.addEventListener('offline', render);
applyTheme();
checkPermission();
render();
// Draw icons now, and again whenever any part of the screen is redrawn.
paintIcons();
let iconQueued = false;
new MutationObserver(() => {
  if (iconQueued) return;
  iconQueued = true;
  requestAnimationFrame(() => { iconQueued = false; paintIcons(); });
}).observe(document.getElementById('phone'), {childList: true, subtree: true});
