<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joruri BD Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#006A4E;--green-2:#0c8d68;--green-weak:#e3f2ec;--red:#C8102E;--amber:#b86e00;
  --ink:#14211C;--muted:#5a6a63;--line:#dde5e1;--bg:#f2f6f4;--card:#fff;--side:#0d1d17;--field:#fff;
  --shadow:0 1px 2px rgba(16,48,38,.06),0 8px 24px -14px rgba(16,48,38,.35);
  font-family:'Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --green:#2fb487;--green-2:#46c99a;--green-weak:#12372b;--red:#ff6b7f;--amber:#f0b44c;
  --ink:#e6efeb;--muted:#9fb1a9;--line:#24342e;--bg:#0b1411;--card:#111d19;--side:#07100d;--field:#0e1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-size:15.5px;line-height:1.5}
a{color:var(--green)}
h1{font-size:26px;margin:0 0 14px;letter-spacing:-.3px}h1 small{color:var(--muted);font-weight:500;font-size:16px}
h2{margin:0 0 12px}h3{margin:0 0 8px;font-size:17px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 14px;transition:background .15s,border-color .15s,transform .05s}
button:hover{border-color:var(--green)}button:active{transform:translateY(1px)}button:disabled{opacity:.6;cursor:default}
button.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
button.primary:hover{background:var(--green-2)}
button.danger{color:var(--red)}button.danger:hover{border-color:var(--red)}
button.link{border:0;background:none;color:var(--green);padding:0;text-align:left}button.link:hover{text-decoration:underline}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--ink)}
textarea.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
.ico{width:20px;height:20px;fill:currentColor;flex:none}
.layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;margin:0 6px 14px}.brand img{width:40px;height:40px;border-radius:12px;background:#fff;padding:4px}
.brand b{font-size:17px}.brand small{display:block;opacity:.65}
.navhead{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.45;margin:14px 12px 4px}
.navbtn{display:flex;gap:11px;align-items:center;width:100%;background:none;border:0;color:#cfe3da;text-align:left;padding:8px 12px;border-radius:10px}
.navbtn .ico{opacity:.75}.navbtn:hover{background:rgba(255,255,255,.07);color:#fff}
.navbtn.on{background:linear-gradient(90deg,rgba(47,180,135,.28),rgba(47,180,135,.08));color:#fff;font-weight:600}.navbtn.on .ico{opacity:1;color:#6fe0b6}
.who{margin-top:auto;padding:12px 8px 4px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.who small{opacity:.7;word-break:break-all}.who .link{color:#9fe6c8}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;background:rgba(127,127,127,.18);margin-left:6px}
.badge.owner{background:#f0b44c;color:#2b1d00;margin-left:0}.who .badge{margin-left:0}
.main{padding:26px 32px 60px;max-width:1240px;width:100%}
.topbar{display:none}
.head{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.head h1{margin:0;flex:1;min-width:200px}.head input{max-width:260px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0;box-shadow:var(--shadow)}
.card.bad{border-color:#f3b3bd;background:color-mix(in srgb,var(--red) 7%,var(--card))}.card.ok{border-color:#a6dcc4;background:color-mix(in srgb,var(--green) 7%,var(--card))}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:16px;border-radius:16px;text-align:left;background:var(--card);box-shadow:var(--shadow)}
.stat .ico{color:var(--green);width:22px;height:22px;margin-bottom:6px}.stat b{font-size:28px;color:var(--ink);line-height:1.2}.stat small{color:var(--muted)}
.todo{margin:0;padding-left:20px}.todo li{margin:4px 0}
.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:15px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tbody tr:hover{background:color-mix(in srgb,var(--green) 4%,transparent)}tbody tr:last-child td{border-bottom:0}
th{background:color-mix(in srgb,var(--line) 35%,var(--card));font-size:13px;color:var(--muted);font-weight:600;position:sticky;top:0}tr.muted td{color:#9aa7a1}
td.actions{white-space:nowrap;text-align:right}td.actions button{margin-left:6px}
.overlay{position:fixed;inset:0;background:rgba(8,20,16,.5);display:flex;justify-content:center;align-items:flex-start;padding:30px 16px;overflow:auto;z-index:10;backdrop-filter:blur(2px)}
.editor{background:var(--card);border-radius:18px;padding:22px;width:min(780px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
.field.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:500}.field.check input{width:auto;width:18px;height:18px}
.field.bi .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field.bi label{display:flex;flex-direction:column;gap:4px;font-weight:500}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.err{color:var(--red);font-weight:600}.warn{color:var(--amber)}.hint{color:var(--muted)}.center{text-align:center}
.login{max-width:420px;margin:10vh auto;display:flex;flex-direction:column;gap:12px}.login .logo{width:84px;align-self:center}.login h1{text-align:center}
.login label{display:flex;flex-direction:column;gap:4px;font-weight:600;color:var(--muted)}
.login details summary{cursor:pointer;color:var(--green);font-weight:600;margin:4px 0 8px}.stack{display:flex;flex-direction:column;gap:12px}
.login .card{margin:0}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);padding:30px 0}
.spinner{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;right:20px;bottom:20px;background:#13261f;color:#fff;padding:12px 16px;border-radius:12px;z-index:20;box-shadow:var(--shadow);max-width:min(420px,calc(100vw - 40px))}.toast.bad{background:var(--red)}
code{background:color-mix(in srgb,var(--line) 60%,transparent);padding:2px 6px;border-radius:6px}
.scrim{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:30;transform:translateX(-100%);transition:transform .2s}
  body.menu-open .side{transform:none}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}
  .topbar{display:flex;gap:12px;align-items:center;margin:-10px 0 14px}.topbar .menu{font-size:20px;padding:4px 12px}
  .main{padding:16px 16px 60px}
  .field.bi .two{grid-template-columns:1fr}
  .head input{max-width:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="backend-firebase.js"></script>
<script src="app.js"></script>
</body>
</html>
