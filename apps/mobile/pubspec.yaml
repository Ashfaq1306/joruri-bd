name: joruri_bd
description: JORURI BD - Bangladesh emergency response companion. Help when every second matters.
publish_to: none
version: 1.3.1+15

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  joruri_core:
    path: ../../packages/core
  joruri_design_system:
    path: ../../packages/design_system

  # State management + dependency injection
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.6.2
  # Local settings and contacts (sandboxed app storage)
  shared_preferences: ^2.3.3

  # Device services
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  android_intent_plus: ^5.2.0
  device_info_plus: ^11.1.1
  connectivity_plus: ^6.1.1
  share_plus: ^10.1.3

  # Online: content updates from the admin website, SMS sign-in, live donors.
  # "any" lets pub pick the newest versions that fit your Flutter SDK.
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  path_provider: any
  # Google Sign-In (free on the Firebase Spark plan). 7.x API: initialize() + authenticate().
  google_sign_in: ^7.2.0

  # Toolkit
  battery_plus: ^6.2.0
  torch_light: ^1.0.0
  flutter_compass: ^0.8.1
  audioplayers: ^6.1.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # App icon from the Joruri logo: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/seed/
    - assets/seed/pharmacies/
    - assets/sounds/

  # Hind Siliguri, bundled by tool/get_fonts.dart (SIL Open Font License, see assets/fonts/OFL.txt)
  fonts:
    - family: Hind Siliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Regular.ttf
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
